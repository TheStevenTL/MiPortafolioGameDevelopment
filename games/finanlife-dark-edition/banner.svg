<svg viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="300" fill="url(#bgGrad)"/>

  <!-- subtle grid -->
  <g stroke="#1e293b" stroke-width="1">
    <line x1="0" y1="60" x2="1000" y2="60"/>
    <line x1="0" y1="120" x2="1000" y2="120"/>
    <line x1="0" y1="180" x2="1000" y2="180"/>
    <line x1="0" y1="240" x2="1000" y2="240"/>
  </g>

  <!-- board path strip -->
  <g>
    <rect x="60" y="222" width="90" height="48" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
    <rect x="165" y="222" width="90" height="48" rx="8" fill="#0c4a6e" stroke="#38bdf8" stroke-width="2"/>
    <rect x="270" y="222" width="90" height="48" rx="8" fill="#451a03" stroke="#fbbf24" stroke-width="2"/>
    <rect x="375" y="222" width="90" height="48" rx="8" fill="#3b0764" stroke="#a855f7" stroke-width="2"/>
    <rect x="480" y="222" width="90" height="48" rx="8" fill="#4c0519" stroke="#f43f5e" stroke-width="2"/>
    <rect x="585" y="222" width="90" height="48" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
    <rect x="690" y="222" width="90" height="48" rx="8" fill="#0c4a6e" stroke="#38bdf8" stroke-width="2"/>
    <rect x="795" y="222" width="90" height="48" rx="8" fill="#451a03" stroke="#fbbf24" stroke-width="2"/>
    <rect x="850" y="222" width="90" height="48" rx="8" fill="#3b0764" stroke="#a855f7" stroke-width="2" opacity="0.85"/>
  </g>

  <text x="500" y="105" font-size="58" font-weight="800" fill="url(#titleGrad)" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Segoe UI', Arial">FINANLIFE</text>
  <text x="500" y="150" font-size="24" letter-spacing="4" fill="#a855f7" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Segoe UI', Arial">DARK EDITION</text>
  <text x="500" y="188" font-size="18" fill="#94a3b8" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Segoe UI', Arial">De la universidad a la jubilación</text>

  <text x="112" y="140" font-size="34" text-anchor="middle">💰</text>
  <text x="888" y="140" font-size="34" text-anchor="middle">📈</text>
</svg>
